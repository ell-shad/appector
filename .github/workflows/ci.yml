name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install package validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            desktop-file-utils dpkg-dev gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 \
            gir1.2-gtk-4.0 gnupg lintian python3-gi shellcheck \
            libxml2-utils

      - name: Set up Python tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Lint (ruff)
        run: |
          python3 -m pip install --disable-pip-version-check ruff
          ruff check appector tests

      - name: Run unit tests with coverage
        run: |
          python3 -m pip install --disable-pip-version-check coverage
          coverage run -m unittest discover -s tests
          coverage report --fail-under=55
          coverage report

      - name: Compile application modules
        run: python3 -m compileall -q appector

      - name: Validate the polkit policy
        run: |
          # Validated against the DTD when available; the schema-less
          # xmllint fallback still catches malformed XML.
          if ls /usr/share/polkit-1/actions/*.policy >/dev/null 2>&1; then
            xmllint --noout --dtdvalid \
              /usr/share/polkit-1/actions/org.freedesktop.policykit.policy \
              helper/com.appector.appector.policy
          else
            xmllint --noout helper/com.appector.appector.policy
          fi

      - name: Check packaging shell script
        run: |
          sh -n scripts/build-deb.sh
          shellcheck scripts/build-deb.sh

      - name: Check APT repository shell scripts
        run: |
          sh -n scripts/build-apt-repo.sh
          shellcheck scripts/build-apt-repo.sh
          sh -n scripts/generate-apt-signing-key.sh
          shellcheck scripts/generate-apt-signing-key.sh

      - name: Build and inspect Debian package
        run: |
          ./scripts/build-deb.sh
          package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --info "$package"
          lintian --pedantic "$package"
          desktop-file-validate build/appector_*/usr/share/applications/com.appector.appector.desktop

      - name: Validate AppStream metainfo
        run: |
          if command -v appstreamcli >/dev/null 2>&1; then
            appstreamcli validate build/appector_*/usr/share/metainfo/com.appector.appector.metainfo.xml
          else
            xmllint --noout assets/metainfo/com.appector.appector.metainfo.xml
          fi

      - name: Build the APT repository
        run: |
          ./scripts/build-apt-repo.sh
          test -f apt-repo/dists/stable/Release
          test -f apt-repo/dists/stable/main/binary-all/Packages
          test -f apt-repo/dists/stable/main/binary-all/Packages.gz
          test -f "$(find apt-repo/pool -name '*.deb' -print -quit)"
          # No signing key exists in CI. The release workflow is what must
          # produce signatures; publishing unsigned metadata would be
          # rejected by apt, so it is guarded there instead.
