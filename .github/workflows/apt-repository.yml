name: Publish APT repository

# Kept separate from the GitHub Release workflow on purpose. The release must
# still publish if GitHub Pages is unavailable or misconfigured; a broken
# archive should be a visible failure here, not a reason users miss a release.
on:
  push:
    tags:
      - "v*"
  schedule:
    # The published metadata carries a 30-day Valid-Until, so it has to be
    # re-signed even when no release is cut. A weekly run leaves four attempts
    # before anything expires, and a failing refresh is visible in the Actions
    # tab long before users see "Release file is expired".
    - cron: "17 3 * * 1"
  # Manual runs default to printing the archive public key without publishing
  # anything. Public keys are not secret, so this exists to recover or confirm
  # the committed key without having to keep a local copy of the private key.
  # With `refresh` checked it re-signs and republishes the metadata instead,
  # which also repairs an archive that has already expired.
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-sign and republish the currently published repository metadata"
        type: boolean
        default: false

# A scheduled refresh and a release publish both rewrite the Pages site. Run
# them one at a time, so a refresh can never deploy metadata built from the
# pool it read before a release replaced it.
concurrency:
  group: apt-repository
  cancel-in-progress: false

# Least privilege. The signing key is read from repository secrets, which are
# available to the workflow regardless of these token permissions.
permissions:
  contents: read

jobs:
  show-archive-key:
    if: github.event_name == 'workflow_dispatch' && !inputs.refresh
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Print the archive public key
        env:
          APPECTOR_GPG_KEY: ${{ secrets.APPECTOR_GPG_KEY }}
        run: |
          set -eu
          if [ -z "${APPECTOR_GPG_KEY:-}" ]; then
            echo "::error::APPECTOR_GPG_KEY is not set."
            exit 1
          fi
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$APPECTOR_GPG_KEY" | gpg --batch --quiet --import
          echo "Fingerprint:"
          gpg --batch --list-secret-keys --with-colons \
            | awk -F: '/^fpr:/ {print $10; exit}'
          echo "Public key (commit this as apt/keys/appector-archive-keyring.asc):"
          gpg --batch --yes --armor --export

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # The signing key is the project's release credential: publishing through
    # this environment means a reviewer can approve the repository before the
    # key is used. Configure required reviewers in repository settings.
    environment: public-release
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev gnupg

      - name: Verify tag matches application version
        run: |
          version=$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' appector/__init__.py)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match application version v$version"
            exit 1
          }

      - name: Refuse to publish a pre-release into the stable channel
        run: |
          mkdir -p dist
          python3 scripts/release-notes.py \
            "$GITHUB_REF_NAME" CHANGELOG.md dist/release-notes.md \
            dist/prerelease > /dev/null
          if [ "$(cat dist/prerelease)" = "1" ]; then
            echo "::error::$GITHUB_REF_NAME is marked as a pre-release in the changelog. Pre-releases must not replace the stable APT channel, so nothing was published. Publish pre-releases as GitHub Release assets only, or cut a full release."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is a full release; publishing to stable."

      - name: Require the signing key
        env:
          APPECTOR_GPG_KEY: ${{ secrets.APPECTOR_GPG_KEY }}
        run: |
          if [ -z "${APPECTOR_GPG_KEY:-}" ]; then
            echo "::error::The APPECTOR_GPG_KEY secret is not set. Store the exported secret key with: gh secret set APPECTOR_GPG_KEY --repo $GITHUB_REPOSITORY < appector-archive-secret-key.asc"
            exit 1
          fi

      # S12: single attested build. The .deb published to the APT repository
      # is the exact artifact the release workflow built and attested —
      # this workflow never rebuilds it, so the release asset and the apt
      # package can never diverge.
      - name: Download the attested release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' --pattern 'SHA256SUMS' --dir dist
          # The downloaded asset carries its own checksum manifest from the
          # release job; verify the artifact before publishing it further.
          ( cd dist && sha256sum --check SHA256SUMS )
          ls -l dist

      - name: Fetch the previously published pool
        # Retention (S12): the new pool carries the previous releases forward,
        # then trims to the newest three, so users updating from an older list
        # still find their files. The Pages deployment is not a git ref, so the
        # previous pool is read back from the served repository.
        run: |
          set -eu
          rm -rf previous-repo
          mkdir -p previous-repo
          sh ./scripts/fetch-published-pool.sh previous-repo \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/$(basename "$GITHUB_REPOSITORY")"

      - name: Build and sign the APT repository
        env:
          APPECTOR_GPG_KEY: ${{ secrets.APPECTOR_GPG_KEY }}
          APPECTOR_GPG_KEY_ID: ${{ secrets.APPECTOR_GPG_KEY_ID }}
          APPECTOR_GPG_PASSPHRASE: ${{ secrets.APPECTOR_GPG_PASSPHRASE }}
          APPECTOR_PREVIOUS_REPO: ${{ github.workspace }}/previous-repo
        run: sh ./scripts/build-apt-repo.sh

      - name: Verify the repository before publishing
        env:
          APPECTOR_GPG_KEY: ${{ secrets.APPECTOR_GPG_KEY }}
          APPECTOR_GPG_PASSPHRASE: ${{ secrets.APPECTOR_GPG_PASSPHRASE }}
        run: >-
          sh ./scripts/verify-apt-repo.sh apt-repo
          apt/keys/appector-archive-keyring.asc

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload the repository as a Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apt-repo

      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  refresh:
    # Re-signs the metadata of the already published repository, so the
    # archive never expires between releases. Tag pushes go through `publish`
    # above; this runs weekly, and on demand to repair an expired archive.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
    runs-on: ubuntu-24.04
    # Deliberately no `environment:`. This job republishes metadata for
    # packages a reviewer already approved for publication; requiring a
    # reviewer every week would simply let the archive expire unattended.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev gnupg

      - name: Require the signing key
        env:
          APPECTOR_GPG_KEY: ${{ secrets.APPECTOR_GPG_KEY }}
        run: |
          if [ -z "${APPECTOR_GPG_KEY:-}" ]; then
            echo "::error::The APPECTOR_GPG_KEY secret is not set, so the repository metadata cannot be re-signed and will expire. Store the exported secret key with: gh secret set APPECTOR_GPG_KEY --repo $GITHUB_REPOSITORY < appector-archive-secret-key.asc"
            exit 1
          fi

      - name: Locate the published repository
        id: published
        run: |
          set -eu
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/$(basename "$GITHUB_REPOSITORY")"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$base/dists/stable/main/binary-all/Packages" || true)
          if [ "$status" = "200" ]; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            echo "Published repository found at $base."
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
            echo "Nothing is published yet (HTTP $status); there is no metadata to refresh."
          fi

      - name: Download the published pool
        if: steps.published.outputs.exists == '1'
        run: |
          set -eu
          mkdir -p dist
          sh ./scripts/fetch-published-pool.sh dist "${{ steps.published.outputs.base }}"
          ls -l dist

      - name: Backfill releases that never reached the pool
        # Releases published while the pool was not carried forward exist
        # only as GitHub Release assets, so anyone pinned to one of them got
        # a 404 from this repository. Read those assets into the pool; they
        # are verified against each release's SHA256SUMS before being served.
        if: steps.published.outputs.exists == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh ./scripts/fetch-release-debs.sh dist
          ls -l dist

      - name: Re-sign the repository metadata
        if: steps.published.outputs.exists == '1'
        env:
          APPECTOR_GPG_KEY: ${{ secrets.APPECTOR_GPG_KEY }}
          APPECTOR_GPG_KEY_ID: ${{ secrets.APPECTOR_GPG_KEY_ID }}
          APPECTOR_GPG_PASSPHRASE: ${{ secrets.APPECTOR_GPG_PASSPHRASE }}
        run: sh ./scripts/build-apt-repo.sh

      - name: Verify the repository before publishing
        if: steps.published.outputs.exists == '1'
        env:
          APPECTOR_GPG_KEY: ${{ secrets.APPECTOR_GPG_KEY }}
          APPECTOR_GPG_PASSPHRASE: ${{ secrets.APPECTOR_GPG_PASSPHRASE }}
        run: >-
          sh ./scripts/verify-apt-repo.sh apt-repo
          apt/keys/appector-archive-keyring.asc

      - name: Configure GitHub Pages
        if: steps.published.outputs.exists == '1'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload the repository as a Pages artifact
        if: steps.published.outputs.exists == '1'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apt-repo

      - name: Publish to GitHub Pages
        if: steps.published.outputs.exists == '1'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
